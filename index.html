<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="themeToggle">🌓</button>

    <div class="container">
        <p id="currentDate"></p>
        <h1>minhas tarefas</h1>

        <div class="tab-navigation">
            <button onclick="switchTab('list')" id="listTabBtn" class="tab-btn active">Lista</button>
            <button onclick="switchTab('calendar')" id="calTabBtn" class="tab-btn">Calendário</button>
        </div>

        <div id="listView">
            <div class="progress-wrapper">
                <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
                <span id="progressText">0% concluído</span>
            </div>

            <div class="input-group">
                <input type="text" id="taskInput" placeholder="O que fazer?">
                <div class="input-row">
                    <input type="date" id="taskDate">
                    <input type="text" id="taskDuration" placeholder="Duração (ex: 2h)">
                    <button id="addTaskBtn">Adicionar</button>
                </div>
            </div>
            <ul id="taskList"></ul>
        </div>

        <div id="calendarView" style="display: none;">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">❮</button>
                <h2 id="monthDisplay"></h2>
                <button onclick="changeMonth(1)">❯</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            
            <div id="dayTasksView" class="day-tasks-popup">
                <h3 id="selectedDayTitle"></h3>
                <ul id="dayTaskList"></ul>
                <button onclick="closeDayTasks()" class="close-popup-btn">Fechar</button>
            </div>
        </div>

        <div class="footer">
            <p id="countDisplay">0 tarefas</p>
            <button id="clearAll">Limpar Tudo</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
