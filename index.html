<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Meu To-Do List Profissional</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="container">
        <button id="themeToggle">🌓</button>
        <p id="currentDate"></p>
        
        <h1>Minhas Tarefas</h1>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="O que precisa ser feito?">
            <button id="addTaskBtn">Adicionar</button>
        </div>
        
        <div class="filters">
    <button onclick="filterTasks('all')" class="active">Todas</button>
    <button onclick="filterTasks('pending')">Pendentes</button>
    <button onclick="filterTasks('completed')">Concluídas</button>
</div>

        <ul id="taskList"></ul>

        <div class="footer">
            <p>Você tem <span id="count">0</span> tarefa(s).</p>
            <button id="clearAll">Limpar Tudo</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
