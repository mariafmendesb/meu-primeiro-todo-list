<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Planner Pro</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="container" id="mainContainer">
        <button id="themeToggle" class="theme-btn">
            <i class="ph ph-moon-stars" id="themeIcon"></i>
        </button>
        
        <div id="miniTimer" class="mini-timer" onclick="showTab('pomodoroView')">
            <i class="ph ph-timer"></i>
            <span id="miniTimerText">25:00</span>
        </div>
        
        <header id="mainHeader">
            <p id="currentDate" class="date-display"></p>
            <h1 class="main-title">Minhas Tarefas</h1>
            <p id="dailyQuote" class="daily-quote">Buscando inspiração...</p>
        </header>

        <nav class="nav-tabs" id="mainNav">
            <button onclick="showTab('listView')" id="btn-listView" class="active"><i class="ph ph-list-checks"></i></button>
            <button onclick="showTab('calendarView')" id="btn-calendarView"><i class="ph ph-calendar-blank"></i></button>
            <button onclick="showTab('habitView')" id="btn-habitView"><i class="ph ph-target"></i></button> 
            <button onclick="showTab('pomodoroView')" id="btn-pomodoroView"><i class="ph ph-timer"></i></button>
            <button onclick="showTab('statsView')" id="btn-statsView"><i class="ph ph-chart-line-up"></i></button>
        </nav>

        <hr class="divider" id="mainDivider">

        <section id="listView" class="tab-content">
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="O que vamos fazer?" class="full-width">
                <div class="input-row">
                    <input type="date" id="taskDate">
                    <input type="date" id="taskEndDate" placeholder="Fim">
                </div>
                <div class="input-row">
                    <input type="time" id="startTime">
                    <input type="time" id="endTime">
                    <select id="taskCategory">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                        <option value="Health">Health</option>
                    </select>
                    <button id="priorityToggleBtn" class="priority-btn" title="Alta Prioridade" type="button">
                        <i class="ph ph-flag"></i>
                    </button>
                </div>
                <button id="addTaskBtn" class="main-btn">ADICIONAR TAREFA</button>
            </div>
            
            <ul id="taskList"></ul>
            
            <footer class="list-footer">
                <p id="countDisplay">0 tarefas globais</p>
                <div class="clear-box">
                    <select id="clearOption">
                        <option value="today">Hoje</option>
                        <option value="week">Semana</option>
                        <option value="month">Mês</option>
                        <option value="all">Tudo</option>
                    </select>
                    <button id="clearBtn">Limpar</button>
                </div>
            </footer>
        </section>

        <section id="calendarView" class="tab-content" style="display:none">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">‹</button>
                <h2 id="monthDisplay"></h2>
                <button onclick="changeMonth(1)">›</button>
            </div>
            <div class="calendar-weekdays">
                <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
        </section>

        <section id="habitView" class="tab-content" style="display:none">
            <div class="habit-tracker">
                <h3 class="habit-title">Hábitos Diários</h3>
                <div class="habit-input-section">
                    <input type="text" id="habitNameInput" placeholder="Novo hábito (ex: beber água)..." style="width: 100%;">
                    <button onclick="addHabit()" class="habit-add-btn">ADICIONAR</button>
                </div>
                <div class="habit-list" id="habitList"></div>
            </div>
        </section>

        <section id="statsView" class="tab-content" style="display:none">
            <div class="stats-grid">
                <div class="chart-box">
                    <p class="chart-label">Distribuição por Categoria</p>
                    <div class="chart-container-mini">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-box">
                    <p class="chart-label">Produtividade (Últimos 7 dias)</p>
                    <div class="chart-container-mini">
                        <canvas id="weeklyChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="backup-section">
                <p class="backup-title">Gestão de Dados</p>
                <div class="backup-btns">
                    <button onclick="exportData()" class="backup-btn-action">
                        <i class="ph ph-download-simple"></i> EXPORTAR
                    </button>
                    <label for="importFile" class="backup-btn-action">
                        <i class="ph ph-upload-simple"></i> IMPORTAR
                    </label>
                    <input type="file" id="importFile" style="display:none" onchange="importData(event)">
                </div>
            </div>
        </section>

        <section id="pomodoroView" class="tab-content" style="display:none">
            <div class="pomodoro-box">
                <div id="timerDisplay" class="timer-text">25:00</div>
                
                <div class="time-config">
                    <input type="number" id="customTimeInput" value="25" min="1" max="120">
                    <span>min</span>
                </div>

                <div class="timer-btns">
                    <button id="startTimer" class="timer-btn">START</button>
                    <button id="pauseTimer" class="timer-btn">PAUSE</button>
                    <button id="resetTimer" class="timer-btn">RESET</button>
                </div>
                
                <div class="zen-mode" id="zenModeControls">
                    <p>Sons Ambiente</p>
                    <div class="zen-controls">
                        <button onclick="toggleSound('rain')" id="btn-rain" class="zen-btn"><i class="ph ph-cloud-rain"></i></button>
                        <button onclick="toggleSound('fire')" id="btn-fire" class="zen-btn"><i class="ph ph-fire"></i></button>
                        <button onclick="toggleSound('waves')" id="btn-waves" class="zen-btn"><i class="ph ph-waves"></i></button>
                    </div>
                    <audio id="sound-rain" loop src="https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg"></audio>
                    <audio id="sound-fire" loop src="https://actions.google.com/sounds/v1/ambiences/fire.ogg"></audio>
                    <audio id="sound-waves" loop src="https://actions.google.com/sounds/v1/water/waves_crashing_on_rock_beach.ogg"></audio>
                </div>
                <button id="exitFocusBtn" class="main-btn" style="display:none; margin-top: 20px;">SAIR DO FOCO</button>
            </div>
        </section>
    </div>

    <div id="dayTasksPopup" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="selectedDateTitle">Data</h3>
                <button onclick="closeDayPopup()" class="close-btn"><i class="ph ph-x"></i></button>
            </div>
            <ul id="dayTasksList"></ul>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
