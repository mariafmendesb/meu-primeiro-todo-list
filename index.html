<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Planner Pro</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="container">
        <button id="themeToggle" class="theme-btn">
            <i class="ph ph-moon-stars" id="themeIcon"></i>
        </button>
        
        <header>
            <p id="currentDate" class="date-display"></p>
            <h1 class="main-title">Minhas Tarefas</h1>
            <p id="dailyQuote" class="daily-quote">Buscando inspiração...</p>
        </header>

        <nav class="tab-navigation">
            <button onclick="switchTab('list')" id="listTabBtn" class="tab-btn active">LISTA</button>
            <button onclick="switchTab('calendar')" id="calendarTabBtn" class="tab-btn">CALENDÁRIO</button>
            <button onclick="switchTab('stats')" id="statsTabBtn" class="tab-btn">INSIGHTS</button>
            <button onclick="switchTab('pomodoro')" id="pomodoroTabBtn" class="tab-btn">FOCO</button>
        </nav>

        <hr class="divider">

        <section id="listView" class="tab-content">
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="O que vamos fazer?" class="full-width">
                <div class="input-row">
                    <input type="date" id="taskDate">
                    <input type="date" id="taskEndDate" placeholder="Fim">
                </div>
                <div class="input-row">
                    <input type="time" id="startTime">
                    <input type="time" id="endTime">
                    <select id="taskCategory">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                        <option value="Health">Health</option>
                    </select>
                </div>
                <button id="addTaskBtn" class="main-btn">ADICIONAR TAREFA</button>
            </div>
            
            <ul id="taskList"></ul>
            
            <footer class="list-footer">
                <p id="countDisplay">0 tarefas globais</p>
                <div class="clear-box">
                    <select id="clearOption">
                        <option value="today">Hoje</option>
                        <option value="week">Semana</option>
                        <option value="month">Mês</option>
                        <option value="all">Tudo</option>
                    </select>
                    <button id="clearBtn">Limpar</button>
                </div>
            </footer>
        </section>

        <section id="calendarView" class="tab-content" style="display:none">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">‹</button>
                <h2 id="monthDisplay"></h2>
                <button onclick="changeMonth(1)">›</button>
            </div>
            <div class="calendar-weekdays">
                <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
        </section>

        <section id="statsView" class="tab-content" style="display:none">
            <div class="chart-container">
                <canvas id="categoryChart"></canvas>
            </div>
            
            <div class="habit-tracker">
                <h3 class="habit-title">Hábitos Diários</h3>
                
                <div class="habit-input-section">
                    <input type="text" id="habitNameInput" placeholder="Novo hábito (ex: beber água)..." style="width: 100%;">
                    <button onclick="addHabit()" class="habit-add-btn">ADICIONAR</button>
                </div>
                <div class="habit-list" id="habitList">
                    </div>
            </div>
        </section>

        <section id="pomodoroView" class="tab-content" style="display:none">
            <div class="pomodoro-box">
                <div id="timerDisplay" class="timer-text">25:00</div>
                <div class="timer-btns">
                    <button id="startTimer" class="timer-btn">START</button>
                    <button id="pauseTimer" class="timer-btn">PAUSE</button>
                    <button id="resetTimer" class="timer-btn">RESET</button>
                </div>
                
                <div class="zen-mode">
                    <p>Sons Ambiente</p>
                    <div class="zen-controls">
                        <button onclick="toggleSound('rain')" id="btn-rain" class="zen-btn"><i class="ph ph-cloud-rain"></i></button>
                        <button onclick="toggleSound('fire')" id="btn-fire" class="zen-btn"><i class="ph ph-fire"></i></button>
                        <button onclick="toggleSound('waves')" id="btn-waves" class="zen-btn"><i class="ph ph-waves"></i></button>
                    </div>
                    <audio id="sound-rain" loop src="https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg"></audio>
                    <audio id="sound-fire" loop src="https://actions.google.com/sounds/v1/ambiences/fire.ogg"></audio>
                    <audio id="sound-waves" loop src="https://actions.google.com/sounds/v1/water/waves_crashing_on_rock_beach.ogg"></audio>
                </div>
            </div>
        </section>
    </div>

    <div id="dayTasksPopup" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="selectedDateTitle">Data</h3>
                <button onclick="closeDayPopup()" class="close-btn"><i class="ph ph-x"></i></button>
            </div>
            <ul id="dayTasksList"></ul>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
